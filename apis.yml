aid: rapidsos
name: RapidSOS
description: >-
  RapidSOS operates what it calls "the world's largest Safety Network," an
  intelligent safety platform that connects public safety agencies (911 / ECCs),
  enterprises, and hundreds of millions of connected devices to deliver
  AI-powered emergency detection, verification, and escalation for faster, more
  informed emergency response. RapidSOS exposes partner APIs so technology
  partners can send emergency-related information into the safety platform and
  public-safety partners can consume incident data, alongside products including
  Alerts and IAR (IamResponding). The developer documentation at
  developer.rapidsos.com is partner-login gated and RapidSOS does not publish an
  open OpenAPI specification. Backed by Insight Partners and Playground Global.
